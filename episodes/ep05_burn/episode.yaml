      - 家在烧，歌在唱：GTA6 第一章结尾的《BURN》
    body: |
      《GTA6》第一章结尾的任务 Home Sweet Home，Lucia 的家烧起来了，Travis Scott 的《BURN》跟着她一路逃。这期拆这首歌：为什么是 Travis Scott，那层隔着烟的人声，trap 底子却拿掉了鼓，以及它怎么一直跟着玩家走。

      章节
      {chapters}

      “在我听来”的部分是个人听感；Rob Nelson 原话出自其采访（IT之家转述），《堡垒之夜》演唱会人数来自 ESPN 报道。
      实机录像：YouTube 频道 Agent Tyler Gaming。
      {owners}
