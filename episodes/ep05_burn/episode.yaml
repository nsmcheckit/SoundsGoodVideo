      GTA6 第一章结尾，Lucia 的家着火了，门外全是警察。Travis Scott 的《BURN》一直跟着她逃：隔着烟的人声，只剩 808 在压的低音，来电时往后让一步，被发现时又压上来一层鼓。这就是游戏音乐的叙事。
