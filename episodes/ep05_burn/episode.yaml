listening:
  - {id: q1, src: A, label: 实机原声, in: 84.0, out: 98.0, question: 这段里，副歌第一次唱出 burn this shit down 的时候，屏幕右下角是不是几乎同时弹出朋友 Andy 的短信“Call me”？,
     context: "第 05 段。实测：短信大约在 1:27 弹出，那句歌词大约在 1:30 唱出来。", options: [是，几乎同时, 差得有点远，不算对上, 这句不是副歌第一次出现]}
  - {id: q2, src: A, label: 实机原声, in: 150.0, out: 186.0, question: 大约 2:38 以后，歌里还有没有人声？是不是只剩伴奏在循环？,
     context: 第 07 段最后一句“到后半段人声退场，只剩鼓和低音一圈一圈地转”。, options: [没有人声了，就是伴奏在循环, 还有人声, 伴奏变了，不是同一段在循环]}
  - {id: q3, src: A, label: 实机原声, in: 255.0, out: 300.0, question: 大约 4:27 被警察发现以后，音乐本身有没有变猛（鼓更密、更响）？还是只是多了警笛、喊话和引擎声？,
     context: "第 09 段。实测：被发现后打击乐那一层响了约 3 dB，但分不开是音乐还是音效。", options: [音乐本身变猛了, 音乐没变，是音效多了, 听不出来]}
  - {id: q4, src: A, label: 实机原声, in: 182.0, out: 205.0, question: Lucia 给朋友打电话这段，音乐是不是明显往后退了、给对白让路？,
     context: "第 08 段。实测：通话期间整段响度从约 -18.3 掉到约 -21.9 LUFS。", options: [是，音乐明显退后, 音乐没变，只是整体变化, 听不出来]}

sections:
  - id: s01
    chapter: 开场
    pre: 1.0
    post: 0.8
    paras:
      - {id: p01, claim: opinion, text: 《GTA6》发售三天，这首 Travis Scott 的歌，专辑里没有，电台里也没有，整个游戏只在一个任务里能听到。,
         en: ["Three days after GTA 6 launched, this Travis Scott song isn't on any album or station; you only hear it in one mission."], en_dub: ["Three days into GTA 6: a Travis Scott song on no album, heard in one mission."]}
      - {id: p03, claim: quote, text: 点赞最多的一条评论：整个任务，就是一部电影。,
         en: ["The top comment: this whole mission was a movie."], en_dub: ["Top comment: this whole mission was a movie."]}
    music:
      - {src: A, in: 142.5, at: start, free: true, reuse: 开场用第二遍副歌配评论墙，后面讲声音时用的是第一遍}
    video:
      - {src: A01, follow: A, at: start}
    gfx:
      - {type: comments, at: start, until: end, params: {"comments": [{"user": "@m•••58", "zh": "悬念、恐惧、音乐……配上这首歌，Lucia 的逃亡完全不一样了", "en": "The suspense, the fear, the music…", "likes": "2.1K", "big": true}, {"user": "@p•••05", "zh": "有史以来最好的任务之一，我全身都在发麻", "en": "my whole body was buzzing", "likes": "961", "big": true}, {"user": "@T•••ac", "zh": "给 Lucia 逃亡选这首歌的人，该加薪", "en": "deserves a raise", "likes": "314", "big": false}, {"user": "@I•••45", "zh": "这一个任务就能单挑 GTA5 所有抢劫任务", "en": "this mission solos any gta 5 heists", "likes": "942", "big": true}, {"user": "@L•••20", "zh": "这一幕其实挺伤感的", "en": "low key sad af", "likes": "413", "big": false}, {"user": "@o•••58", "zh": "这个任务让我把这款游戏从 10 分打到了 20 分", "en": "from a 10/10 to a 20/10", "likes": "698", "big": true}, {"user": "@c•••rl", "zh": "R 星总能做出配乐让人忘不掉的任务", "en": "such memorable soundtracks", "likes": "379", "big": false}, {"user": "@a•••82", "zh": "那些无聊的任务，都是为了这一刻", "en": "it was all to make the mission even more dramatic", "likes": "323", "big": false}, {"user": "@H•••rd", "zh": "上次在任务里起鸡皮疙瘩，还是《荒野大镖客 2》", "en": "goosebumps on a mission like this", "likes": "322", "big": false}, {"user": "@c•••21", "zh": "为什么 Spotify 上没有？", "en": "WHY IS THIS NOT ON SPOTIFY", "likes": "144", "big": false}, {"user": "@S•••yo", "zh": "歌在警察到处都是、朋友发来短信时响起，氛围拉满", "en": "genuinely peak atmosphere", "likes": "237", "big": false}, {"user": "@D•••bi", "zh": "整个任务我都在起鸡皮疙瘩", "en": "I had chills through this entire mission", "likes": "174", "big": false}, {"user": "@P•••ve", "zh": "想象一下你们一起建起来的家被烧掉", "en": "a house you build together burn down", "likes": "41", "big": false}, {"user": "@T•••ez", "zh": "警察喇叭和这首歌叠在一起，太带劲了", "en": "The sound of cops intercom hit soo hard", "likes": "14", "big": false}], "step": 0.62, "t0": 0.4, "stats": {"label": "播放最多的搬运视频 · 两天", "asof": "YouTube 数据截至 2026 年 11 月 22 日", "items": [{"to": 574000, "fmt": "wan", "digits": 0, "unit": "播放"}, {"to": 14721, "fmt": "wan", "digits": 2, "unit": "赞"}, {"to": 461, "unit": "条评论"}]}}}   # ID 打码；评论与点赞数 11-22 抓取
      - {type: hero, at: p03, until: end, params: {"comment": {"user": "@d•••87", "zh": "整个任务，就是一部电影", "en": "This whole mission was a f***ing movie", "likes": "2.9K", "ago": "2 天前"}, "index": 3}}

  - id: s02
    chapter: 家着火了
    pre: 0.8
    paras:
      - {id: p04, claim: official, text: 第一章快结束时，Lucia 回到她和 Jason 的家。房子已经烧起来了，门外全是警察。这个任务，叫 Home Sweet Home。,
         en: ["Near the end of Chapter One, Lucia goes back to the home she shares with Jason.", "It's already on fire, and police are everywhere.", "The mission is called Home Sweet Home."], en_dub: ["Late in Chapter One, Lucia returns to the home she shares with Jason.", "It's burning, police outside.", "The mission: Home Sweet Home."]}
    music:
      - {src: A, in: 45.22, at: start, reuse: 回到逃跑的前半段；开场那段是第二遍副歌。入点让第一遍副歌落在第 04 段说完之后}
    video:
      - {src: A01, follow: A, at: start}
    gfx:
      - {type: tag, at: start+0.3, dur: 4.0, params: {text: 第一章 · Home Sweet Home, en: CHAPTER ONE}}

  - id: s03
    chapter: 为什么是 Travis Scott
    pre: 0.4
    paras:
      - {id: p06, claim: quote, text: Rockstar North 的联合负责人 Rob Nelson 说过，他们做一款新游戏，很多时候是先有一首歌，方向才定下来。,
         en: ["Rockstar North co-head Rob Nelson has said that for a new game, there's often a song first, and the direction follows."], en_dub: ["Rockstar North's Rob Nelson says a new game often starts with a song; the direction follows."]}
      - {id: p07, claim: official, text: 这一段，他们找了 Travis Scott。他在《堡垒之夜》里开过一场演唱会，一千两百多万人同时在线。,
         en: ["For this stretch, they went to Travis Scott.", "He once played a concert inside Fortnite, with more than twelve million players online at once."], en_dub: ["So they called Travis Scott.", "His Fortnite concert drew over twelve million players at once."]}
      - {id: p08, claim: opinion, text: 在我看来，他大概是最懂游戏的说唱歌手。, en: ["To me, he may be the rapper who understands games best."], en_dub: ["To me, no rapper gets games better."]}
    music:
      - {src: A, at: start}
    video:
      - {src: A01, follow: A, at: start}
    gfx:
      - {type: quote, at: p06@他们做, until: p07, params: {text: 最初可能只是一个模糊的意象，更多时候，我们会围绕一首歌来凝聚创作方向。, source: Rob Nelson，Rockstar North 联合负责人}}

  - id: s04
    chapter: 隔着烟的声音
    pre: 0.3
    post: 5.5          # 让第一遍副歌出来
    paras:
      - {id: p09, claim: ear, text: 在我听来，他最适合这里的是声音：厚厚的 auto-tune，加上很大的混响，人声像是隔着烟飘过来的，字听不太清，情绪先到了。,
         en: ["To my ear, what fits here is his voice: thick Auto-Tune and a huge reverb, as if it's drifting through smoke; you can't quite catch the words, but the feeling lands first."], en_dub: ["To my ear, it's the voice: thick Auto-Tune, huge reverb, drifting like smoke; you miss the words, but the feeling lands first."]}
      - {id: p10, claim: official, text: Lucia 这时候刚受了伤，眼前发花，满耳朵是火声和警笛。,
         en: ["Lucia has just been hurt; her vision swims, and all she can hear is fire and sirens."], en_dub: ["Lucia's just been hurt; her vision swims, and she hears only fire and sirens."]}
    music:
      - {src: A, at: start}
    video:
      - {src: A01, follow: A, at: start}

  - id: s05
    chapter: 烧了它
    pre: 0.2
    paras:
      - {id: p11, claim: opinion, text: 副歌翻来覆去就一个词：Burn。房子真的在烧，可这首歌一点也不慌，像一个失去了一切的人，反倒不怕了。,
         en: ["The chorus keeps coming back to one word: Burn.", "The house really is burning, yet the song doesn't panic at all; it sounds like someone who has lost everything, and so has nothing left to fear."], en_dub: ["The chorus circles one word: Burn.", "The house is burning, yet the song stays calm, like someone with nothing left to lose."]}
      - {id: p12, claim: ear, text: 在我听来，它是 trap 的底子，却把 trap 的鼓拿掉了。前大半首听不到密密的 hi-hat，只剩又沉又长的 808 在底下走，上面铺一层迷幻的合成器。只有低音在压、没有鼓在催，像极了警匪片里的暗藏玄机。,
         en: ["To my ear, it's built on trap, with the trap drums taken out.", "For most of the song there are no rapid hi-hats, just a deep, long 808 underneath and a layer of hazy synths on top.", "Only the bass pressing, no drums pushing, like the hidden tension in a crime thriller."], en_dub: ["To my ear, it's trap with the drums pulled out.", "For most of it, no rattling hi-hats, just a long, deep 808 underneath and hazy synths on top.", "Only bass pressing, no drums pushing, like the hidden tension in a crime thriller."]}
      - {id: p13, claim: opinion, text: 潜行本来是最安静的玩法。这首歌一进来，你趴在草丛里，心跳却跟着低音一下一下往上顶。,
         en: ["Stealth is usually the quietest way to play.", "With this song on, you're lying in the bushes while your heartbeat climbs with the bass."], en_dub: ["Stealth is the quietest way to play.", "With this on, you're lying in the grass while your heart climbs with the bass."]}
    music:
      - {src: A, at: start}
    video:
      - {src: A01, follow: A, at: start}

  - id: s06
    chapter: 跟着你走
    pre: 0.4
    paras:
      - {id: p14, claim: ear, confirmed_by: q2, text: 它还一直跟着你。后半段人声退场，伴奏一圈圈地转，你跑多久，它就陪多久。,
         en: ["And it stays with you.", "Later the vocals drop out and the beat keeps circling; however long you run, it runs with you."], en_dub: ["It stays with you.", "The vocals drop, the beat loops, and it runs as long as you do."]}
    music:
      - {src: A, in: 164.5, at: start}
    video:
      - {src: A01, follow: A, at: start}

  - id: s07
    pre: 0.3
    post: 7.0          # 让朋友那句 police everywhere... 原样出来，音乐在下面让路
    paras:
      - {id: p15, claim: ear, confirmed_by: q4, text: 朋友打来电话，它往后让了一步。,
         en: ["When a friend calls, it steps back."], en_dub: ["A friend calls; it steps back."]}
    music:
      - {src: A, in: 182.84, at: start}   # p15 说完（约 185.8）后电话接通（187.3）
    video:
      - {src: A01, follow: A, at: start}

  - id: s08
    pre: 0.3
    post: 4.0          # 让新叠进来的那层鼓出来
    paras:
      - {id: p16, claim: ear, confirmed_by: q3, text: 被警察发现，它又压上来一层鼓。,
         en: ["When the police spot you, another layer of drums piles on."]}
    music:
      - {src: A, in: 281.3, at: start}   # Jee：4:45 另一层鼓进来；“一层鼓”落在 285 前后
    video:
      - {src: A01, follow: A, at: start}

  - id: s09
    chapter: 同一首歌
    pre: 0.3
    post: 6.0          # 片尾卡下留着警察无线电“车辆已经不见了”
    paras:
      - {id: p17, claim: opinion, text: 每个人逃的路线都不一样，记住的却是同一首歌。,
         en: ["Everyone escapes a different way, but they all remember the same song."], en_dub: ["Everyone runs a different route, but remembers the same song."]}
      - {id: p18, claim: opinion, text: 这就是 GTA6 中的音频电影化叙事：让一首歌，替主角把话说出来。,
         en: ["This is cinematic storytelling through audio in GTA 6: letting a song speak for the protagonist."], en_dub: ["This is GTA 6's cinematic storytelling in sound: letting a song speak for the protagonist."]}
      - {id: p19, claim: opinion, text: 可惜这首歌到现在还没正式发行，想听，只能回游戏里再逃一遍。,
         en: ["Too bad it still hasn't been released; to hear it, you'll have to escape all over again."], en_dub: ["Sadly it's still unreleased.", "To hear it, you'll have to run it again."]}
      - {id: p20, text: 更多游戏声音拆解，关注 SoundsGood。, en: ["More game audio breakdowns: follow SoundsGood."]}
    music:
      - {src: A, in: 302.0, at: start}
    video:
      - {src: A01, follow: A, at: start}
    gfx:
      - {type: big, at: p17, dur: 4.6, params: {lines: [路线不一样 ｜ 记住的是同一首歌], size: 58, script: 'different roads, same song', stickers: [{image: assets/stickers/police.png, side: left, scale: .72, caption: no way home}, {image: assets/stickers/bike.png, side: right, scale: .6, caption: ride it out}]}}   # photo stickers cut from A01 at 73 s and 290 s, no characters
      - {type: end, at: p20, until: end, full: true, params: {owners: [游戏画面与音乐版权归 Rockstar Games 及相关权利人所有]}}

