pinned_comment: |
  几个可能有争议的点，先说明：
  1. “整个游戏只在一个任务里能听到”来自攻略站和媒体的整理，R 星没有官方说明；如果你在别处听到过，欢迎补充。
  2. “trap 的底子、拿掉了鼓”是我的听感：前大半首测不到规律的 hi-hat，低频一直是 808 在走，4:45 前后才叠进另一层鼓。
  3. “最懂游戏的说唱歌手”是个人观点，依据是他在《堡垒之夜》的演唱会（ESPN 报道约 1230 万人同时在线）。

