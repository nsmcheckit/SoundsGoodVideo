    body: |
      GTA 6, chapter one, Home Sweet Home. Lucia's home is on fire and the police are outside; Travis Scott's BURN follows her the whole way. Why Travis Scott, the voice that drifts through smoke, a trap bed with the drums taken out, and a song that stays with the player.

      Chapters
      {chapters}

