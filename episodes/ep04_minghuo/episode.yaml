  - id: s10
    chapter: 收尾
    pre: 0.3
    post: 3.5
    paras:
      - {id: p29, claim: official, text: 唐代岑参写过一场边塞军宴：中军置酒饮归客，胡琴琵琶与羌笛。胡琴的“胡”，本来就是外来的意思。一千多年前，它也是从塞外传进中原的新声音。,
         en: ["The Tang poet Cen Shen wrote of a frontier banquet: wine in the commander's tent for the departing guest, with huqin, pipa and Qiang flute.", "The hu in huqin simply means foreign.", "Over a thousand years ago, it too was a new sound brought in from beyond the frontier."]}
      - {id: p30, claim: opinion, text: 一千多年后，它成了中式的骨，又和底特律的底鼓、欧洲的 breakdown 站进了同一场仗，谁也没压过谁。中西从来不是二选一，音乐本来就没有国界。,
         en: ["A thousand years on, it has become the Chinese bones, standing in one fight with Detroit's kick and Europe's breakdown, none drowning out the others.", "East and West were never a choice of one; music has no borders."]}
      - {id: p31, claim: opinion, text: 更难得的是，它还在讲故事：被操纵的人，配上机器的节奏；替人讨债的人，由胡琴开口。,
         en: ["Rarer still, it tells the story: the man on strings gets the machine's rhythm, and the one settling the debt speaks through the huqin."]}
      - {id: p32, claim: opinion, text: 国产 3A 还屈指可数，一首 Boss 曲也代表不了全部。但《冥火流星》说明了一件事：中国的 3A 游戏，已经有能力用一首足够强的音乐，撑起一段叙事。,
         en: ["Chinese AAA games are still few, and one boss theme can't speak for all of them.", "But Nether Flame Meteor shows one thing: Chinese AAA games can now hold up a story with music strong enough to carry it."]}
      - {id: p33, text: 更多游戏声音拆解，关注 SoundsGood。, en: ["More game audio breakdowns: follow SoundsGood."]}
    music:
      - {src: A, at: start}
    video:
      - {src: A01, follow: A, at: start}
    gfx:
      - {type: quote, at: p29@中军, until: p30-0.2, params: {text: 中军置酒饮归客，胡琴琵琶与羌笛。, source: 岑参《白雪歌送武判官归京》}}
      - {type: end, at: p33, until: end, full: true, params: {owners: [游戏画面与音乐版权归 S-GAME 所有]}}
