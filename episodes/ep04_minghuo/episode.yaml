  - id: s10
    chapter: 收尾
    pre: 0.3
    post: 3.5
    paras:
      - {id: p30, claim: opinion, text: 底特律的底鼓，欧洲的 breakdown，中国的胡琴，在这一场仗里谁也没压过谁。中西从来不是二选一，音乐本来就没有国界。,
         en: ["Detroit's kick, Europe's breakdown, China's huqin: in this fight, none drowns out the others.", "East and West were never a choice of one; music has no borders."]}
      - {id: p31, claim: opinion, text: 更难得的是，它不只是好听，还在讲故事：被操纵的人，配上机器的节奏；替人讨债的人，由胡琴开口。,
         en: ["Rarer still, it isn't just good to listen to; it tells the story: the man on strings gets the machine's rhythm, and the one settling the debt speaks through the huqin."]}
      - {id: p32, claim: opinion, text: 国产 3A 还屈指可数，一首 Boss 曲也代表不了全部。但《冥火流星》说明了一件事：中国的 3A 游戏，已经有能力用一首足够强的音乐，撑起一段叙事。,
         en: ["Chinese AAA games are still few, and one boss theme can't speak for all of them.", "But Nether Flame Meteor shows one thing: Chinese AAA games can now hold up a story with music strong enough to carry it."]}
      - {id: p33, text: 更多游戏声音拆解，关注 SoundsGood。, en: ["More game audio breakdowns: follow SoundsGood."]}
