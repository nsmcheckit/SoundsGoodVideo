pinned_comment: |
  几个可能有争议的点，先说明：
  1. 二阶段那段旋律，有人听成二胡，有人听成京胡、板胡。我们实测它的音域、揉弦和滑音都是胡琴的拉法，而且像几件乐器一起齐奏，所以视频里统一叫“胡琴”（拉弦乐器的统称）。如果你知道原声带的演奏署名，欢迎补充。
  2. 岑参诗里的“胡琴”泛指当时从西域、北方传来的乐器，不一定是今天的二胡；引用它只是想说，“胡”本来就是外来的意思。
  3. 一阶段更像 Trance、二阶段是 Techno，这是我们的分析和听感，欢迎讨论。
